<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard รวมภาค 11</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Sarabun", "Noto Sans Thai", sans-serif; background: #f2f4f7; color: #1a1a1a; font-size: 18px; }
  header { background: #0b5cad; color: #fff; padding: 22px 16px; text-align: center; }
  header h1 { margin: 0; font-size: 28px; }
  main { max-width: 1000px; margin: 0 auto; padding: 18px 16px 40px; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  a.c { display: block; background: #fff; border: 3px solid #c3c9d2; border-radius: 16px; padding: 20px; color: inherit; text-decoration: none; }
  a.c:hover, a.c:focus-visible { border-color: #0b5cad; }
  a.c h2 { margin: 0 0 6px; font-size: 24px; }
  a.c p { margin: 0; color: #555; font-size: 16px; }
</style>
</head>
<body>
<header><h1>Dashboard รวมภาค 11</h1></header>
<main>
  <a class="c" href="4division.html">
    <h2>📷 สนทนาธรรม 4 ฝ่าย</h2>
    <p>สถานะการส่งรูปประจำเดือนของแต่ละพื้นที่</p>
  </a>
</main>
</body>
</html>
