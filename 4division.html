<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard สนทนาธรรม 4 ฝ่าย</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Sarabun", "Noto Sans Thai", sans-serif; background: #f2f4f7; color: #1a1a1a; font-size: 18px; }
  header { background: #0b5cad; color: #fff; padding: 18px 16px; text-align: center; }
  header h1 { margin: 0; font-size: 26px; }
  header p { margin: 6px 0 0; font-size: 18px; }
  header a { color: #cfe3fa; font-size: 16px; text-decoration: none; display: inline-block; margin-bottom: 8px; }
  main { max-width: 1240px; margin: 0 auto; padding: 14px 16px 40px; }
  #stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .st { background: #fff; border-radius: 14px; padding: 12px 8px; text-align: center; }
  .st b { display: block; font-size: 34px; line-height: 1.1; }
  .st span { font-size: 15px; color: #555; }
  .st.g b { color: #12692b; } .st.y b { color: #8a5a00; } .st.r b { color: #b3261e; }
  #bar { height: 14px; margin: 14px 0; background: #e3e7ed; border-radius: 7px; overflow: hidden; }
  #bar i { display: block; height: 100%; width: 0; background: #1a8f3c; transition: width .3s; }
  #tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  #tabs button { flex: 1 1 auto; min-height: 44px; padding: 0 14px; border: 2px solid #0b5cad; border-radius: 12px; background: #fff; color: #0b5cad; font: inherit; font-weight: 700; cursor: pointer; }
  #tabs button.on { background: #0b5cad; color: #fff; }
  #grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .a { background: #fff; border: 3px solid #c3c9d2; border-radius: 14px; padding: 12px 14px; }
  .a.part { border-color: #d9a400; background: #fff7dc; }
  .a.done { border-color: #1a8f3c; background: #e6f6ea; }
  .a h3 { margin: 0 0 6px; font-size: 21px; }
  .a div { display: flex; justify-content: space-between; font-size: 16px; padding: 2px 0; }
  #msg { text-align: center; padding: 30px 0; color: #555; }
  #upd { text-align: center; font-size: 14px; color: #777; margin-top: 18px; }
  @media (max-width: 520px) { #stats { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header>
  <a href="index.html">← Dashboard รวมภาค 11</a>
  <h1>สนทนาธรรม 4 ฝ่าย</h1>
  <p id="mon">&nbsp;</p>
</header>
<main>
  <div id="stats">
    <div class="st"><b id="n-all">–</b><span>พื้นที่ทั้งหมด</span></div>
    <div class="st g"><b id="n-done">–</b><span>ส่งครบ</span></div>
    <div class="st y"><b id="n-part">–</b><span>ส่งบางส่วน</span></div>
    <div class="st r"><b id="n-none">–</b><span>ยังไม่ส่ง</span></div>
  </div>
  <div id="bar"><i></i></div>
  <div id="tabs"></div>
  <div id="msg">กำลังโหลด…</div>
  <div id="grid"></div>
  <div id="upd"></div>
</main>
<script>
const TH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const SLOTS = ['ภาพบรรยากาศ', 'ภาพถ่ายหมู่'];
// same Apps Script web app as BKK11-4DivisionMeeting
const API = 'https://script.google.com/macros/s/AKfycbx0IgSpakNWcEQLuo8f2S9sA0xtOYNw6XgqxfkjVH-zs9fUzpccFgM3cHDGliiLYEOY/exec';
const $ = id => document.getElementById(id);
const TABS = [['all', 'ทั้งหมด'], ['none', 'ยังไม่ส่ง'], ['part', 'ส่งบางส่วน'], ['done', 'ส่งครบ']];
let S = null, f = 'all';

const kind = a => { const n = a.sent.filter(Boolean).length; return n == a.sent.length ? 'done' : n ? 'part' : 'none'; };

function render() {
  const [y, m] = S.month.split('-').map(Number);
  $('mon').textContent = 'เดือน ' + TH[m - 1] + ' ' + (y + 543);
  const c = { done: 0, part: 0, none: 0 };
  S.areas.forEach(a => c[kind(a)]++);
  $('n-all').textContent = S.areas.length;
  $('n-done').textContent = c.done;
  $('n-part').textContent = c.part;
  $('n-none').textContent = c.none;
  $('bar').firstChild.style.width = (100 * c.done / S.areas.length) + '%';
  $('tabs').textContent = '';
  TABS.forEach(([k, t]) => {
    const b = document.createElement('button');
    b.textContent = t + (k == 'all' ? '' : ' (' + c[k] + ')');
    if (k == f) b.className = 'on';
    b.onclick = () => { f = k; render(); };
    $('tabs').append(b);
  });
  const g = $('grid');
  g.textContent = '';
  const rows = S.areas.filter(a => f == 'all' || kind(a) == f);
  $('msg').textContent = rows.length ? '' : 'ไม่มีพื้นที่ในหมวดนี้';
  rows.forEach(a => {
    const d = document.createElement('div');
    d.className = 'a ' + kind(a);
    const h = document.createElement('h3');
    h.textContent = a.name;
    d.append(h);
    SLOTS.forEach((t, i) => {
      const r = document.createElement('div');
      const l = document.createElement('span');
      l.textContent = t;
      const v = document.createElement('span');
      v.textContent = a.sent[i] ? '✅ ส่งแล้ว' : '⬜ ยังไม่ส่ง';
      r.append(l, v);
      d.append(r);
    });
    g.append(d);
  });
  $('upd').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH') + ' (รีเฟรชอัตโนมัติทุก 60 วินาที)';
}

const load = () => fetch(API + '?api=status').then(r => r.json()).then(j => {
  if (j.error) throw new Error(j.error);
  S = j;
  render();
}).catch(() => { if (!S) $('msg').textContent = 'โหลดข้อมูลไม่สำเร็จ กรุณารีเฟรชหน้า'; });
load();
setInterval(load, 60000);
</script>
</body>
</html>
